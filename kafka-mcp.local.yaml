http:
  address: "127.0.0.1:8090"
  # No browser origin is allowed by default; requests that carry an Origin
  # header get 403. Name a browser-based MCP client's origin to enable it, and
  # set auth_token before exposing the listener beyond this machine.
  # auth_token: "{env:KAFKA_MCP_TOKEN}"
  # cors:
  #   allow_origins: ["https://mcp-client.example"]
output_dir: /tmp/kafka-mcp-exports
clusters:
  local:
    brokers: localhost:19092
    schema_registry:
      urls: ["http://localhost:18081"]
endpoints:
  local:
    cluster: local
    path: /mcp/local
    description: Local Redpanda debugging
