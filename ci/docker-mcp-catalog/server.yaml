# Entry for the Docker MCP Catalog (github.com/docker/mcp-registry).
# It is not read from here: copy it to servers/kafka-mcp/server.yaml in a fork
# of that repository, set source.commit, and add the tools.json that
# ci/mcpb/package.sh writes to dist/mcpb/. See PUBLISHING.md.
name: kafka-mcp
image: mcp/kafka-mcp
type: server
meta:
  category: database
  tags:
    - kafka
    - redpanda
    - streaming
    - devops
about:
  title: Kafka MCP
  description: Debug Kafka from an agent. Find a message by key or field, measure consumer lag and when it clears, unblock a stuck consumer, replay since a moment, compare two clusters. Read-only endpoints hide every tool that writes, and every write previews what it would change first.
  icon: https://avatars.githubusercontent.com/u/47359?s=200&v=4
source:
  project: https://github.com/denizgursoy/kafka-mcp
  commit: SET-TO-THE-RELEASED-COMMIT
run:
  command:
    - --server=false
    - --endpoint={{kafka-mcp.endpoint}}
  env:
    CONFIG_FILE: /config/kafka-mcp.yaml
  volumes:
    - "{{kafka-mcp.config_file}}:/config/kafka-mcp.yaml:ro"
config:
  description: Point the server at your kafka-mcp.yaml, which names the clusters to connect to and the endpoints to expose. Keep passwords out of the file with "{env:VAR}".
  parameters:
    type: object
    properties:
      config_file:
        type: string
        description: Absolute path to your kafka-mcp.yaml on this machine
      endpoint:
        type: string
        description: Endpoint from the file to serve. Leave empty when the file defines only one
        default: ""
    required:
      - config_file
